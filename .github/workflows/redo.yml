# Refaire les clips de vidéos précises pour un agent, avec le choix des moments actuel.
# Ce workflow ne télécharge rien : il dépose la demande dans la file d'Otto Clip, et c'est le moteur principal
# (« Moteur Otto Clip ») qui la traite dans les ~20 s. Une seule machine utilise ainsi les cookies YouTube :
# deux machines sur la même session au même moment, et YouTube la déconnecte.
# Les nouveaux clips arrivent « à valider » dans Otto Clip (aperçu + Valider / Refuser), rien n'est publié.
name: Refaire des clips

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Id de l'agent Otto Clip"
        required: true
      urls:
        description: "URLs des vidéos, séparées par des virgules"
        required: true

jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Demande de reprise
        env:
          OTTO_API_URL: ${{ secrets.OTTO_API_URL }}
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
          AGENT: ${{ inputs.agent }}
          URLS: ${{ inputs.urls }}
        run: |
          body=$(python3 -c 'import json,os; print(json.dumps({"agentId": os.environ["AGENT"], "urls": [u.strip() for u in os.environ["URLS"].split(",") if u.strip()]}))')
          curl -sS --fail-with-body -X POST "$OTTO_API_URL/api/engine/redo" \
            -H "authorization: Bearer $ENGINE_TOKEN" -H "content-type: application/json" -d "$body"
          echo
          echo "Demande déposée : le moteur principal la traite dans les ~20 s."
