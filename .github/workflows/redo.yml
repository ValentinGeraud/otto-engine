# Refaire les clips de vidéos précises pour un agent, avec le choix des moments actuel.
# Rien n'est publié : les nouveaux clips arrivent « à valider » dans Otto Clip (aperçu + Valider / Refuser).
name: Refaire des clips

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Id de l'agent Otto Clip"
        required: true
      urls:
        description: "URLs des vidéos, séparées par des virgules"
        required: true

concurrency:
  group: otto-redo
  cancel-in-progress: false

jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OTTO_API_URL: ${{ secrets.OTTO_API_URL }}
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
      OTTO_AI: groq
      OTTO_WORKER_ID: cloud-redo
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cookies YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            python ytcookies.py "$RUNNER_TEMP/yt-cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Outils système (ffmpeg, polices)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji ttf-mscorefonts-installer > /dev/null
          fc-cache -f > /dev/null
      - name: Dépendances
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"
          npm ci --prefix remotion --no-audit --no-fund
      - name: Modèles de visage (opencv_zoo, Apache 2.0)
        run: |
          mkdir -p models
          base=https://github.com/opencv/opencv_zoo/raw/main/models
          curl -sSfL -o models/face_detection_yunet_2023mar.onnx $base/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSfL -o models/face_recognition_sface_2021dec.onnx $base/face_recognition_sface/face_recognition_sface_2021dec.onnx
      - name: Cache des modèles Whisper et du navigateur Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            remotion/node_modules/.remotion
          key: models-v1
      - name: Refaire les clips
        env:
          AGENT: ${{ inputs.agent }}
          URLS: ${{ inputs.urls }}
        run: python saas_worker.py --agent "$AGENT" --redo "$URLS"
