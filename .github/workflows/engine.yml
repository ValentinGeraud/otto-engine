# Moteur Otto Clip dans le cloud (GitHub Actions, gratuit sur un dépôt public).
#
# Chaque session dure ~5 h : un passage complet au démarrage, puis écoute des « Lancer maintenant »
# toutes les 20 s et un passage automatique toutes les 30 min. Le déclencheur toutes les 30 min
# met la session suivante en file : elle démarre dès que la précédente se termine (jamais deux à la fois).
# L'état (vidéos déjà clippées, clips envoyés, créneaux Buffer) est gardé d'une session à l'autre (cache).
#
# Secrets du dépôt : ENGINE_TOKEN, OTTO_API_URL, GROQ_API_KEY.
# Variable du dépôt : OTTO_PUBLISH_ENABLED ("true" pour publier vraiment).
name: Moteur Otto Clip

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: otto-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OTTO_API_URL: ${{ secrets.OTTO_API_URL }}
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
      OTTO_PUBLISH_ENABLED: ${{ vars.OTTO_PUBLISH_ENABLED }}
      OTTO_AI: groq
      OTTO_WORKER_ID: cloud
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # yt-dlp a besoin d'un moteur JavaScript pour YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Cookies YouTube : YouTube les renouvelle à chaque usage, une copie figée finit par expirer.
      # On garde donc la version renouvelée d'une session à l'autre (cache, CHIFFRÉE avec ENGINE_TOKEN car le
      # dépôt est public). Si le secret YT_COOKIES change (nouvel export), c'est lui qui repart.
      - name: Cookies renouvelés (cache)
        uses: actions/cache/restore@v4
        with:
          path: .yt
          key: yt-cookies-${{ github.run_id }}
          restore-keys: yt-cookies-

      - name: Cookies YouTube
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then echo "::warning::Pas de secret YT_COOKIES : YouTube risque de bloquer les téléchargements"; exit 0; fi
          sha=$(printf '%s' "$YT_COOKIES" | sha256sum | cut -c1-16)
          echo "YT_SECRET_SHA=$sha" >> "$GITHUB_ENV"
          if [ -f .yt/cookies.enc ] && [ "$(cat .yt/secret.sha 2>/dev/null)" = "$sha" ] &&              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENGINE_TOKEN -in .yt/cookies.enc -out "$RUNNER_TEMP/yt-cookies.txt" 2>/dev/null; then
            echo "cookies renouvelés repris de la session précédente"
          else
            python ytcookies.py "$RUNNER_TEMP/yt-cookies.txt"
          fi
          echo "YTDLP_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"

      - name: Outils système (ffmpeg, polices)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji ttf-mscorefonts-installer > /dev/null
          fc-cache -f > /dev/null

      - name: Dépendances
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"
          npm ci --prefix remotion --no-audit --no-fund

      - name: Modèles de visage (opencv_zoo, Apache 2.0)
        run: |
          mkdir -p models
          base=https://github.com/opencv/opencv_zoo/raw/main/models
          curl -sSfL -o models/face_detection_yunet_2023mar.onnx $base/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -sSfL -o models/face_recognition_sface_2021dec.onnx $base/face_recognition_sface/face_recognition_sface_2021dec.onnx

      - name: Cache des modèles Whisper et du navigateur Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            remotion/node_modules/.remotion
          key: models-v1

      - name: Reprise de l'état
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            quota.json
            channels/**/*.json
            work/**/*.json
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-

      # Première session seulement : l'état repris du moteur qui tournait sur le PC (secret STATE_SEED,
      # archive tar.gz en base64), pour ne pas re-clipper ni re-facturer des vidéos déjà traitées.
      - name: État initial (depuis le PC)
        if: steps.state.outputs.cache-matched-key == ''
        env:
          STATE_SEED: ${{ secrets.STATE_SEED }}
        run: |
          if [ -n "$STATE_SEED" ]; then echo "$STATE_SEED" | base64 -d | tar -xz && echo "état du PC repris"; fi

      - name: Moteur (≈ 5 h)
        run: python saas_worker.py --listen --first-pass --every 30 --max-minutes 300

      - name: Sauvegarde de l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            quota.json
            channels/**/*.json
            work/**/*.json
          key: engine-state-${{ github.run_id }}

      - name: Garde des cookies renouvelés
        if: always() && env.YTDLP_COOKIES != ''
        run: |
          mkdir -p .yt
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ENGINE_TOKEN -in "$YTDLP_COOKIES" -out .yt/cookies.enc
          echo "$YT_SECRET_SHA" > .yt/secret.sha

      - name: Sauvegarde des cookies
        if: always() && env.YTDLP_COOKIES != ''
        uses: actions/cache/save@v4
        with:
          path: .yt
          key: yt-cookies-${{ github.run_id }}
