# Test manuel : YouTube laisse-t-il le moteur télécharger depuis GitHub Actions ?
# (liste une chaîne surveillée + télécharge une courte vidéo, sans rien publier)
name: Test téléchargement YouTube

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Chaîne à lister"
        default: "@atowrl"
      video:
        description: "Vidéo à télécharger"
        default: "https://www.youtube.com/watch?v=jNQXAC9IVRw"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U yt-dlp
      - name: Liste de la chaîne
        run: yt-dlp --flat-playlist --playlist-end 5 --print "%(id)s %(title)s" "https://www.youtube.com/${{ inputs.channel }}/videos"
      - name: Téléchargement
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          args=""
          if [ -n "$YT_COOKIES" ]; then python ytcookies.py "$RUNNER_TEMP/c.txt"; args="--cookies $RUNNER_TEMP/c.txt"; fi
          deno --version | head -1
          yt-dlp $args -v -F "${{ inputs.video }}" 2>&1 | grep -v -i -E "cookie|header|authorization" | tail -40 || true
          yt-dlp $args -f "bv*[height<=720]+ba/b[height<=720]" -o test.mp4 "${{ inputs.video }}" && ls -la test.mp4
